server:
  port: ${SERVER_PORT:1999}

spring:
  application:
    name: plook

app:
  cors:
    allowed-origin-patterns: ${PLOOK_CORS_ALLOWED_ORIGINS:https://plook.xyqaq.cn,http://localhost:5173}
  rooms:
    allow-create: ${PLOOK_ALLOW_CREATE_ROOMS:true}
    empty-disband-minutes: ${PLOOK_EMPTY_DISBAND_MINUTES:10}
    reconnect-grace-seconds: ${PLOOK_RECONNECT_GRACE_SECONDS:360}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.schuanhe.Plook: info
